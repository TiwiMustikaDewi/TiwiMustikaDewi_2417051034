<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - KopiSukses</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">KopiSukses</div>
            <ul class="nav-links">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="layanan.html">Layanan</a></li>
                <li><a href="kontak.html">Kontak</a></li>
            </ul>
        </nav>
    </header>

    <section class="container">
        <h2 class="section-title">Hubungi Kami</h2>
        <p style="text-align: center; margin-bottom: 30px;">Apakah Anda tertarik membuka coffee shop? Isi formulir di bawah ini untuk berkonsultasi.</p>
        
        <div class="contact-form">
            <form id="contactForm" onsubmit="kirimPesan(event)">
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" required placeholder="Contoh: Budi Setiawan">
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="email@anda.com">
                </div>

                <div class="form-group">
                    <label for="jenis-layanan">Layanan yang Diminati</label>
                    <select id="jenis-layanan" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                        <option>Business Plan</option>
                        <option>Pelatihan Barista</option>
                        <option>Desain Interior</option>
                        <option>Lainnya</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pesanan">Pesan / Pertanyaan</label>
                    <textarea id="pesanan" rows="5" required placeholder="Ceritakan rencana coffee shop Anda..."></textarea>
                </div>

                <button type="submit" class="btn
