<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Mahasiswa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f4f6fb;
            color: #1e293b;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 60px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }

        .logo img {
            height: 60px;
            width: auto;
        }

        nav a {
            text-decoration: none;
            margin-left: 30px;
            font-size: 14px;
            color: #475569;
            font-weight: 500;
            transition: 0.3s;
        }

        nav a:hover {
            color: #7b3fe4;
        }

        main {
            display: flex;
            justify-content: center;
            padding: 80px 20px;
        }

        .form-card {
            background: white;
            width: 420px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
        }

        .form-card h2 {
            margin-bottom: 30px;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 13px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 13px;
            transition: 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #7b3fe4;
            box-shadow: 0 0 0 2px rgba(123,63,228,0.15);
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 6px;
            background: #7b3fe4;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #4b0082;
        }

        footer {
            margin-top: 60px;
            padding: 25px;
            text-align: center;
            background: #1e293b;
            color: #cbd5e1;
            font-size: 13px;
        }

        footer span {
            color: #a78bfa;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <img src="img.png" alt="Universitas Lampung">
    </div>
    <nav>
        <a href="index.html">Home</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>
    <div class="form-card">
        <h2>Form Input Mahasiswa</h2>
        <form action="submit.php" method="post" target="_blank">

            <label for="nama">Nama</label>
            <input type="text" id="nama" name="nama" placeholder="Masukkan nama">

            <label for="npm">NPM</label>
            <input type="text" id="npm" name="npm" placeholder="Masukkan NPM">

            <label for="kelas">Kelas</label>
            <select id="kelas" name="kelas">
                <option>Pilih Kelas</option>
                <option>A</option>
                <option>B</option>
            </select>

            <label for="tanggal">Tanggal</label>
            <input type="date" id="tanggal" name="tanggal">

            <label for="waktu">Waktu</label>
            <input type="time" id="waktu" name="waktu">

            <button type="submit">Submit</button>

        </form>
    </div>
</main>

<footer>
    © 2026 <span>Portal Akademik</span> | Developed by Tiwi MD
</footer>

</body>
</html>
